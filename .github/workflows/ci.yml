name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REQUIRE_TSP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm ls @typespec/compiler @ebusd/ebus-typespec || true
      - run: npm run typecheck
      - run: npm run typecheck:tsp
      # reference data for the decoder and TypeSpec tests (not part of this repository)
      - run: git clone --depth 1 https://github.com/john30/ebusd ../ebusd
      - run: git clone --depth 1 https://github.com/eBUS/ebus.github.io ../ebus.github.io
      # the ebusd-configuration revision the CDN files were generated from
      - run: git clone --depth 1 --branch main20260201 https://github.com/john30/ebusd-configuration ../ebusd-configuration
      # a real ebusd (without a bus) for the live-test commands (M6)
      - name: Build ebusd
        run: |
          cmake -S ../ebusd -B ../ebusd-build -Dmqtt=OFF -Dknx=OFF -Dssl=OFF -DBUILD_TESTING=OFF
          cmake --build ../ebusd-build --target ebusd -j 4
      - run: npm test
        env:
          EBUSD_BIN: ../ebusd-build/src/ebusd/ebusd
          EBUSD_SRC: ../ebusd
          EBUS_CDN: ../ebus.github.io
          EBUSD_CONFIG: ../ebusd-configuration
      - run: npm run build
      - name: Browser end-to-end test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium firefox
          node test/e2e/browser.mjs
      - name: Browser end-to-end test (Firefox)
        run: node test/e2e/browser.mjs
        env:
          E2E_BROWSER: firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-artifacts
          if-no-files-found: ignore
