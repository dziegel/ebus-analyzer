name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      # reference data for the decoder tests (not part of this repository)
      - run: git clone --depth 1 https://github.com/john30/ebusd ../ebusd
      - run: git clone --depth 1 https://github.com/eBUS/ebus.github.io ../ebus.github.io
      - run: npm test
        env:
          EBUSD_SRC: ../ebusd
          EBUS_CDN: ../ebus.github.io
      - run: npm run build
